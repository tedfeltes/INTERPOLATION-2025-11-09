[build-system]
requires = ["setuptools>=66", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exe-activity-logger"
version = "0.1.0"
description = "GUI utility for tracing executable behaviour during manual testing"
authors = [
    { name = "Your Name", email = "you@example.com" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6,<7",
    "psutil>=5.9",
    "pynput>=1.7",
    "keyboard>=0.13",
]

[project.optional-dependencies]
windows = ["pywin32>=306"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["application_logger*"]

[project.scripts]
exe-activity-logger = "application_logger.main:run"
