<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Photo Sheet - 8.5×11 printable collage</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --panel-2: #1f232c;
        --border: #2a2f3a;
        --ink: #e7ebf3;
        --ink-dim: #a8b0be;
        --accent: #d97a4a;
        --accent-ink: #1a1200;
        --focus: #7aa7ff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
      }
      header {
        padding: 18px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      header h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.2px;
      }
      header .subtitle {
        color: var(--ink-dim);
        font-size: 12px;
      }
      main {
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 24px;
        padding: 24px;
        align-items: start;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 18px;
      }
      .panel h2 {
        margin: 0 0 12px 0;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--ink-dim);
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 10px;
      }
      .field { display: flex; flex-direction: column; gap: 6px; }
      .field label {
        font-size: 11px;
        color: var(--ink-dim);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .field input[type="number"],
      .field select {
        background: var(--panel-2);
        color: var(--ink);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 10px;
        font: inherit;
        font-size: 13px;
      }
      .field input[type="number"]:focus,
      .field select:focus {
        outline: 2px solid var(--focus);
        outline-offset: -1px;
      }
      .checkbox {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--ink);
        font-size: 13px;
      }
      button {
        appearance: none;
        border: 1px solid var(--border);
        background: var(--panel-2);
        color: var(--ink);
        border-radius: 6px;
        padding: 9px 12px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover { border-color: #3a414f; }
      button.primary {
        background: var(--accent);
        color: var(--accent-ink);
        border-color: transparent;
        font-weight: 600;
      }
      button.primary:hover { filter: brightness(1.05); }
      button.ghost {
        background: transparent;
      }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
      .drop {
        border: 1.5px dashed var(--border);
        background: var(--panel-2);
        border-radius: 10px;
        padding: 22px;
        text-align: center;
        color: var(--ink-dim);
        cursor: pointer;
        transition: border-color .15s, background .15s;
      }
      .drop:hover, .drop.dragover {
        border-color: var(--accent);
        background: #23252d;
        color: var(--ink);
      }
      .thumbs {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        margin-top: 10px;
      }
      .thumb {
        position: relative;
        aspect-ratio: 1 / 1;
        overflow: hidden;
        border-radius: 6px;
        background: #2a2f3a;
      }
      .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .thumb button.remove {
        position: absolute;
        top: 3px;
        right: 3px;
        width: 20px;
        height: 20px;
        padding: 0;
        border-radius: 999px;
        border: none;
        background: rgba(0,0,0,0.6);
        color: white;
        font-size: 12px;
        line-height: 20px;
        cursor: pointer;
      }
      .thumb .idx {
        position: absolute;
        left: 3px;
        bottom: 3px;
        font-size: 10px;
        background: rgba(0,0,0,0.6);
        color: white;
        padding: 1px 5px;
        border-radius: 4px;
      }
      .preview-wrap {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 0;
      }
      /* The .sheet element is sized at exactly 8.5in x 11in and scaled for on-screen preview */
      .sheet {
        background: white;
        color: #111;
        width: 8.5in;
        height: 11in;
        padding: var(--margin, 0.25in);
        display: grid;
        gap: var(--gap, 0.1in);
        grid-template-columns: repeat(var(--cols, 3), 1fr);
        grid-template-rows: repeat(var(--rows, 3), 1fr);
        box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        transform-origin: top center;
      }
      .sheet.landscape { width: 11in; height: 8.5in; }
      .cell {
        overflow: hidden;
        background: #f2f2f2;
        border: 1px dashed #dcdcdc;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #b8b8b8;
        font-size: 10px;
      }
      .cell img {
        width: 100%;
        height: 100%;
        object-fit: var(--fit, cover);
        display: block;
      }
      .cell.crop-guide { position: relative; }
      .cell.crop-guide::after {
        content: "";
        position: absolute;
        inset: 0;
        border: 1px dashed rgba(0,0,0,0.25);
        pointer-events: none;
      }
      .hint {
        color: var(--ink-dim);
        font-size: 12px;
        margin-top: 8px;
      }
      .scaler {
        padding: 12px;
        background: #0b0d12;
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: auto;
        max-height: calc(100vh - 140px);
      }
      /* Print rules */
      @media print {
        @page { size: letter; margin: 0; }
        html, body { background: white; }
        header, aside.controls, .hint, .scaler-toolbar { display: none !important; }
        main { display: block; padding: 0; }
        .scaler { padding: 0; background: white; border: none; overflow: visible; max-height: none; }
        .sheet { box-shadow: none; transform: none !important; }
        .cell.crop-guide::after, .cell { border: none; background: transparent; }
      }
      .scaler-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        color: var(--ink-dim);
        font-size: 12px;
      }
      .scaler-toolbar input[type="range"] { flex: 1; }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Photo Sheet</h1>
        <div class="subtitle">Fill an 8.5×11 sheet with photos, print, cut apart.</div>
      </div>
      <div class="actions">
        <button id="btn-clear" class="ghost">Clear</button>
        <button id="btn-print" class="primary">Print / Save PDF</button>
      </div>
    </header>

    <main>
      <aside class="controls">
        <section class="panel">
          <h2>Photos</h2>
          <div id="drop" class="drop">
            <div><strong>Drop photos here</strong></div>
            <div class="hint">or click to choose files</div>
            <input id="file-input" type="file" accept="image/*" multiple hidden />
          </div>
          <div id="thumbs" class="thumbs"></div>
          <div class="hint" id="photo-count">No photos yet.</div>
        </section>

        <section class="panel" style="margin-top:16px;">
          <h2>Layout</h2>
          <div class="row">
            <div class="field">
              <label for="cols">Columns</label>
              <input id="cols" type="number" min="1" max="10" value="3" />
            </div>
            <div class="field">
              <label for="rows">Rows</label>
              <input id="rows" type="number" min="1" max="10" value="3" />
            </div>
          </div>
          <div class="row">
            <div class="field">
              <label for="margin">Page margin (in)</label>
              <input id="margin" type="number" step="0.05" min="0" max="1" value="0.25" />
            </div>
            <div class="field">
              <label for="gap">Gap (in)</label>
              <input id="gap" type="number" step="0.05" min="0" max="1" value="0.1" />
            </div>
          </div>
          <div class="row">
            <div class="field">
              <label for="orientation">Orientation</label>
              <select id="orientation">
                <option value="portrait" selected>Portrait</option>
                <option value="landscape">Landscape</option>
              </select>
            </div>
            <div class="field">
              <label for="fit">Fit</label>
              <select id="fit">
                <option value="cover" selected>Cover (fill, may crop)</option>
                <option value="contain">Contain (fit, no crop)</option>
              </select>
            </div>
          </div>
          <div class="checkbox">
            <input id="cropguides" type="checkbox" checked />
            <label for="cropguides">Show cut guides on screen</label>
          </div>
          <div class="actions">
            <button id="btn-auto">Auto grid</button>
            <button id="btn-fill" class="ghost">Repeat to fill</button>
          </div>
          <div class="hint">
            Auto grid picks columns × rows that best match how many photos you have.
            Repeat to fill duplicates photos in order until every cell is used.
          </div>
        </section>
      </aside>

      <section>
        <div class="scaler-toolbar">
          <span>Preview scale</span>
          <input id="zoom" type="range" min="30" max="100" value="60" />
          <span id="zoom-val">60%</span>
        </div>
        <div class="scaler">
          <div id="sheet" class="sheet" aria-label="8.5 by 11 inch sheet preview"></div>
        </div>
      </section>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const state = {
        photos: [], // { url, name }
      };

      const drop = $("drop");
      const fileInput = $("file-input");
      const thumbs = $("thumbs");
      const sheet = $("sheet");
      const cols = $("cols");
      const rows = $("rows");
      const margin = $("margin");
      const gap = $("gap");
      const fit = $("fit");
      const orientation = $("orientation");
      const cropguides = $("cropguides");
      const photoCount = $("photo-count");
      const zoom = $("zoom");
      const zoomVal = $("zoom-val");

      drop.addEventListener("click", () => fileInput.click());
      drop.addEventListener("dragover", (e) => {
        e.preventDefault();
        drop.classList.add("dragover");
      });
      drop.addEventListener("dragleave", () => drop.classList.remove("dragover"));
      drop.addEventListener("drop", (e) => {
        e.preventDefault();
        drop.classList.remove("dragover");
        const files = [...e.dataTransfer.files].filter((f) => f.type.startsWith("image/"));
        addFiles(files);
      });
      fileInput.addEventListener("change", (e) => {
        addFiles([...e.target.files]);
        e.target.value = "";
      });

      $("btn-clear").addEventListener("click", () => {
        state.photos.forEach((p) => URL.revokeObjectURL(p.url));
        state.photos = [];
        render();
      });

      $("btn-print").addEventListener("click", () => window.print());

      $("btn-auto").addEventListener("click", () => {
        const n = state.photos.length || 1;
        // Pick columns × rows that best matches n on a letter page.
        // Prefer near-square cells: cell aspect ~ (pageW/cols) : (pageH/rows) close to 1.
        const pageW = orientation.value === "landscape" ? 11 : 8.5;
        const pageH = orientation.value === "landscape" ? 8.5 : 11;
        let best = { c: 3, r: 3, score: Infinity };
        for (let c = 1; c <= 6; c++) {
          for (let r = 1; r <= 6; r++) {
            if (c * r < n) continue;
            const cellW = pageW / c;
            const cellH = pageH / r;
            const aspect = cellW / cellH;
            const aspectPenalty = Math.abs(Math.log(aspect));
            const waste = c * r - n;
            const score = aspectPenalty * 2 + waste * 0.2;
            if (score < best.score) best = { c, r, score };
          }
        }
        cols.value = best.c;
        rows.value = best.r;
        render();
      });

      $("btn-fill").addEventListener("click", () => {
        const total = (parseInt(cols.value) || 1) * (parseInt(rows.value) || 1);
        if (state.photos.length === 0 || state.photos.length >= total) {
          render();
          return;
        }
        const base = state.photos.slice();
        let i = 0;
        while (state.photos.length < total) {
          const src = base[i % base.length];
          state.photos.push({ url: src.url, name: src.name, dup: true });
          i++;
        }
        render();
      });

      [cols, rows, margin, gap, fit, orientation, cropguides].forEach((el) => {
        el.addEventListener("input", render);
        el.addEventListener("change", render);
      });

      zoom.addEventListener("input", () => {
        zoomVal.textContent = `${zoom.value}%`;
        sheet.style.transform = `scale(${zoom.value / 100})`;
        // Reserve space so the scaled sheet doesn't overflow visibly.
        const scale = zoom.value / 100;
        const w = orientation.value === "landscape" ? 11 : 8.5;
        const h = orientation.value === "landscape" ? 8.5 : 11;
        sheet.style.marginBottom = `${(1 - scale) * h * -96 + 24}px`;
        sheet.style.marginRight = `${(1 - scale) * w * -96}px`;
      });

      function addFiles(files) {
        for (const f of files) {
          const url = URL.createObjectURL(f);
          state.photos.push({ url, name: f.name });
        }
        render();
      }

      function removeAt(i) {
        const [p] = state.photos.splice(i, 1);
        if (p) URL.revokeObjectURL(p.url);
        render();
      }

      function renderThumbs() {
        thumbs.innerHTML = "";
        state.photos.forEach((p, i) => {
          const el = document.createElement("div");
          el.className = "thumb";
          el.innerHTML = `
            <img src="${p.url}" alt="" />
            <span class="idx">${i + 1}</span>
            <button class="remove" title="Remove" aria-label="Remove">×</button>
          `;
          el.querySelector("button.remove").addEventListener("click", () => removeAt(i));
          thumbs.appendChild(el);
        });
        photoCount.textContent = state.photos.length
          ? `${state.photos.length} photo${state.photos.length > 1 ? "s" : ""} loaded.`
          : "No photos yet.";
      }

      function renderSheet() {
        const c = Math.max(1, parseInt(cols.value) || 1);
        const r = Math.max(1, parseInt(rows.value) || 1);
        sheet.style.setProperty("--cols", c);
        sheet.style.setProperty("--rows", r);
        sheet.style.setProperty("--gap", `${gap.value}in`);
        sheet.style.setProperty("--margin", `${margin.value}in`);
        sheet.style.setProperty("--fit", fit.value);
        sheet.classList.toggle("landscape", orientation.value === "landscape");

        sheet.innerHTML = "";
        const total = c * r;
        for (let i = 0; i < total; i++) {
          const cell = document.createElement("div");
          cell.className = "cell" + (cropguides.checked ? " crop-guide" : "");
          const p = state.photos[i];
          if (p) {
            const img = document.createElement("img");
            img.src = p.url;
            img.alt = p.name || "";
            cell.appendChild(img);
          } else {
            cell.textContent = `Empty ${i + 1}`;
          }
          sheet.appendChild(cell);
        }

        // Trigger zoom recompute so the container fits the current sheet size.
        zoom.dispatchEvent(new Event("input"));
      }

      function render() {
        renderThumbs();
        renderSheet();
      }

      // Initial render so preview is visible immediately.
      render();
      zoom.dispatchEvent(new Event("input"));
    </script>
  </body>
</html>
